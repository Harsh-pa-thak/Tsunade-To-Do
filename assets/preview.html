<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tsunade pet — asset preview</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 24px;
    font: 13px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
    background: #14121a; color: #ded7ea;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .09em; color: #b9a7d8; margin: 26px 0 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; }
  .tile { text-align: center; }
  .tile figcaption { margin-top: 6px; font-size: 11px; color: #9c8fb5; }
  .stage { display: inline-block; padding: 6px; border-radius: 8px; }
  .checker {
    background-image:
      linear-gradient(45deg, #4a4458 25%, transparent 25%),
      linear-gradient(-45deg, #4a4458 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #4a4458 75%),
      linear-gradient(-45deg, transparent 75%, #4a4458 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    background-color: #6b6480;
  }
  .light { background: #f4f1ea; }
  .desktop { background: linear-gradient(160deg, #2b1d3a, #12203a 60%, #0d2b2b); }
  img, video { display: block; image-rendering: auto; }
</style>
</head>
<body>
  <h1>Tsunade desktop pet — generated assets</h1>
  <p>Generated by <code>tools/build_assets.py</code> from <code>assets/source/tsunade.png</code>.</p>

  <h2>Cut-out (backdrop removed, bottom faded)</h2>
  <div class="row">
    <div class="tile"><span class="stage checker"><img src="tsunade_cutout.png" height="360"></span><figcaption>checkerboard</figcaption></div>
    <div class="tile"><span class="stage light"><img src="tsunade_cutout.png" height="360"></span><figcaption>on light</figcaption></div>
    <div class="tile"><span class="stage desktop"><img src="tsunade_cutout.png" height="360"></span><figcaption>on desktop-ish</figcaption></div>
    <div class="tile"><span class="stage desktop"><img src="tsunade_sprite.png" height="360"></span><figcaption>rest pose + shadow</figcaption></div>
    <div class="tile"><span class="stage light"><img src="tsunade_sprite.png" height="360"></span><figcaption>rest pose on light (halo check)</figcaption></div>
  </div>

  <h2>Animations (GIF)</h2>
  <div class="row">
    <div class="tile"><span class="stage checker"><img src="anim_idle.gif" height="330"></span><figcaption>idle · loops</figcaption></div>
    <div class="tile"><span class="stage checker"><img src="anim_jiggle.gif" height="330"></span><figcaption>jiggle · once</figcaption></div>
    <div class="tile"><span class="stage checker"><img src="anim_spin.gif" height="330"></span><figcaption>spin / turn around · once</figcaption></div>
    <div class="tile"><span class="stage checker"><img src="anim_hop.gif" height="330"></span><figcaption>hop · once</figcaption></div>
    <div class="tile"><span class="stage checker"><img src="anim_shake.gif" height="330"></span><figcaption>shake · once</figcaption></div>
  </div>

  <h2>Sprite sheets (every frame, left → right)</h2>
  <div class="row">
    <div class="tile"><span class="stage checker"><img src="sheet_idle.png" width="1500"></span><figcaption>idle</figcaption></div>
  </div>
  <div class="row">
    <div class="tile"><span class="stage checker"><img src="sheet_spin.png" width="1500"></span><figcaption>spin / turn around</figcaption></div>
  </div>
  <div class="row">
    <div class="tile"><span class="stage checker"><img src="sheet_hop.png" width="1500"></span><figcaption>hop</figcaption></div>
  </div>
  <div class="row">
    <div class="tile"><span class="stage checker"><img src="sheet_jiggle.png" width="1500"></span><figcaption>jiggle</figcaption></div>
  </div>
  <div class="row">
    <div class="tile"><span class="stage checker"><img src="sheet_shake.png" width="1500"></span><figcaption>shake</figcaption></div>
  </div>

  <h2>Icon</h2>
  <div class="row">
    <div class="tile"><span class="stage checker"><img src="tsunade_icon.png"></span><figcaption>tray / window icon</figcaption></div>
  </div>
</body>
</html>
